name: Check free tool

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check JavaScript syntax
        run: node --check dist/app.js
      - name: Check review-sheet behavior
        run: node check.mjs
      - name: Check local assets and publication boundary
        run: node check-assets.mjs
